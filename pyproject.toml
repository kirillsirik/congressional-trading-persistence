[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "congressional-trading-persistence"
version = "1.1.0"
description = "Replication code for 'On Persistence in Congressional Stock Selection'"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Kirill Sirik" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "pyarrow>=15.0",
    "matplotlib>=3.9",
    "fonttools>=4.50",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
collection = ["requests>=2.31", "beautifulsoup4>=4.12", "lxml>=5.0", "pdfplumber>=0.11", "pytesseract>=0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Pipeline scripts put src/ on sys.path before importing the package.
"scripts/**/*.py" = ["E402"]
